    <!-- Google Consent Mode v2 Default Setup -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      var storedConsent = null;
      try {
        storedConsent = JSON.parse(
          localStorage.getItem("pulsemotion_cookie_consent"),
        );
      } catch (e) {}

      var isAnalyticsGranted =
        storedConsent && storedConsent.analytics === true;

      gtag("consent", "default", {
        analytics_storage: isAnalyticsGranted ? "granted" : "denied",
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        wait_for_update: 500,
      });
    </script>

    <!-- Google Tag Manager (Uruchamiany przy pierwszej interakcji lub po 4.5s – poza oknem pomiaru LCP) -->
    <script>
      function initGTM() {
        if (window.__gtmInitialized) return;
        window.__gtmInitialized = true;
        ["scroll", "pointerdown", "touchstart", "keydown"].forEach(
          function (e) {
            window.removeEventListener(e, initGTM);
          },
        );
        (function (w, d, s, l, i) {
          w[l] = w[l] || [];
          w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
          var f = d.getElementsByTagName(s)[0],
            j = d.createElement(s),
            dl = l != "dataLayer" ? "&l=" + l : "";
          j.async = true;
          j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
          f.parentNode.insertBefore(j, f);
        })(window, document, "script", "dataLayer", "GTM-5HMW9V4B");
      }

      ["scroll", "pointerdown", "touchstart", "keydown"].forEach(function (e) {
        window.addEventListener(e, initGTM, { once: true, passive: true });
      });
      setTimeout(initGTM, 4500);
    </script>
    <!-- End Google Tag Manager -->

    <!-- Skrypty MediaPipe doładowują się w tle po wyświetleniu interfejsu (nie blokują LCP) -->
    <script>
      (function () {
        function loadMediaPipe() {
          if (window.__mpLoaded) return;
          window.__mpLoaded = true;

          var s1 = document.createElement("script");
          s1.src = "/mediapipe/camera_utils/camera_utils.js";
          s1.async = true;
          document.body.appendChild(s1);

          var s2 = document.createElement("script");
          s2.src = "/mediapipe/pose/pose.js";
          s2.async = true;
          document.body.appendChild(s2);
        }

        if (document.readyState === "complete") {
          setTimeout(loadMediaPipe, 1200);
        } else {
          window.addEventListener("load", function () {
            if ("requestIdleCallback" in window) {
              requestIdleCallback(loadMediaPipe, { timeout: 3000 });
            } else {
              setTimeout(loadMediaPipe, 1200);
            }
          });
        }
      })();
    </script>
