<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PulseMotion TV – AI Pose Coach for Amazon Fire TV!</title>

    <meta
      name="description"
      content="AI fitness coach for Amazon Fire TV: on-device pose tracking with MediaPipe and WebAssembly SIMD, hands-free voice control, live rep counter, and zero cloud video streaming."
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob: data:;"
    />

    <!--
      CSP 2.0+: 'wasm-unsafe-eval' (Chromium 95+, Fire OS 7+) allows
      WASM compilation required by MediaPipe without enabling full
      'unsafe-eval'.

      MediaPipe is bundled locally and is not loaded from a CDN.
      All required files are served from /mediapipe/ as part of the
      application build. See public/mediapipe/ and locateFile in
      PoseCamera.tsx.
    -->

    <link rel="canonical" href="https://pulsemotion-firetv.netlify.app/" />

    <link rel="manifest" href="/site.webmanifest" />

    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph (Facebook, LinkedIn, Discord, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pulsemotion-firetv.netlify.app/" />
    <meta property="og:site_name" content="PulseMotion TV" />

    <meta
      property="og:title"
      content="PulseMotion TV – AI Pose Coach for Amazon Fire TV!"
    />

    <meta
      property="og:description"
      content="AI fitness coach for Amazon Fire TV: on-device pose tracking with MediaPipe and WebAssembly SIMD, hands-free voice control, live rep counter, and zero cloud video streaming."
    />

    <meta
      property="og:image"
      content="https://pulsemotion-firetv.netlify.app/assets/1.png"
    />

    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pl_PL" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:url"
      content="https://pulsemotion-firetv.netlify.app/"
    />

    <meta
      name="twitter:title"
      content="PulseMotion TV – AI Pose Coach for Amazon Fire TV!"
    />

    <meta
      name="twitter:description"
      content="AI fitness coach for Amazon Fire TV: on-device pose tracking with MediaPipe and WebAssembly SIMD, hands-free voice control, live rep counter, and zero cloud video streaming."
    />

    <meta
      name="twitter:image"
      content="https://pulsemotion-firetv.netlify.app/assets/1.png"
    />

    <!-- Schema.org JSON-LD Structured Data for Hackathon & Rich Snippets -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PulseMotion TV",
        "url": "https://pulsemotion-firetv.netlify.app/",
        "description": "AI fitness coach for Amazon Fire TV: on-device pose tracking with MediaPipe and WebAssembly SIMD, hands-free voice control, live rep counter, and zero cloud video streaming.",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Amazon Fire OS, Android TV, Modern Web Browsers",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Adam Babinicz",
          "url": "https://github.com/AdamBabinicz/pulsemotion-firetv"
        },
        "browserRequirements": "Requires WebAssembly support",
        "featureList": [
          "100% On-device MediaPipe Pose estimation",
          "Real-time on-device joint angle calculation",
          "Hands-free multi-modal voice navigation",
          "Fire TV remote D-Pad spatial navigation",
          "Zero cloud video streaming privacy"
        ]
      }
    </script>

    <!--
      Google MediaPipe Pose & Camera Utils — bundled locally.
      The files are part of the application build and are served
      from /mediapipe/.
    -->
    <script src="/mediapipe/camera_utils/camera_utils.js"></script>
    <script src="/mediapipe/pose/pose.js"></script>
  </head>

  <body
    class="bg-neutral-950 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 overflow-x-hidden antialiased selection:bg-emerald-500 selection:text-black"
  >
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
